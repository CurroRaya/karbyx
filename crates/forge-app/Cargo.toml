[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
dirs = "7.0.0"
env_logger = "0.11.12"
forge-agent = { version = "0.1.0", path = "../forge-agent" }
forge-ai = { version = "0.1.0", path = "../forge-ai" }
forge-term = { version = "0.1.0", path = "../forge-term" }
glyphon = "0.12.0"
libc = "0.2.191"
log = "0.4.35"
png = "0.18.1"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSUserDefaults", "NSString"] }
